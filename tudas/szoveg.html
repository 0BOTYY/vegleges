<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- Címsorok: -->

    <!-- 1-es szintű: -->

    <h1>Ez egy cím</h1>

    <!-- 2-es szintű -->

    <h2>Ez egy kisebb cím</h2>

    <!-- 3-as szintű -->
    <h3>Ez egy kis cím</h3>

    <!-- h4...h5... -->
    <!-- Egyszerű szöveg: -->
    <p>Ez egy egyszerű szöveg</p>

    <style>
      .modositott {
        color: blue;
        text-decoration: underline;
        text-transform: uppercase;
        font-weight: 600; /* Vastagság 100-900 (400 Sima, 600 Félkövér) */
      }
    </style>

    <!-- Modosított szöveg -->
    <p class="modositott">Ezen a szövegen csomó mindent beállítunk...</p>

    <style>
      .szulo {
        color: green;
        font-weight: 200;
      }
    </style>
    <!-- A gyerekek öröklik a szülő beallításait -->
    <div class="szulo">
      <p>Egyk szöveg</p>
      <p>Masik szöveg</p>
      <p>Harmadik szöveg</p>
    </div>
  </body>
</html>
